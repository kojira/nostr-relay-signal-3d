    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6b6ff" stop-opacity="0.65"/><stop offset="0.45" stop-color="#a65bff" stop-opacity="0.08"/><stop offset="1" stop-color="#a65bff" stop-opacity="0.4"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#9d4bff" stop-opacity="0.18"/><stop offset="1" stop-color="#9d4bff" stop-opacity="0"/></radialGradient>
  </defs>
