<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Nostr — relay signal</title>
  <desc id="desc">An original Nostr logo concept: a sharp violet N with a lightning-shaped diagonal, surrounded by a three-node relay orbit on a dark background.</desc>
